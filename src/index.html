<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动态歌词墙 · LyricsWall</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="prev-large">
  <!-- SVG 图标精灵（统一描边风格，替代 emoji） -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4.5h3.2v15H7zM13.8 4.5H17v15h-3.2z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2A5 5 0 0 0 12.5 5l-1 1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2A5 5 0 0 0 11.5 19l1-1"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4v5h-5"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-6M4 11V3M12 21v-8M12 9V3M20 21v-4M20 13V3M1.5 15h5M9.5 9h5M17.5 17h5"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-realign" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 4 3.5 3-2.5 4 4"/></symbol>
    </defs>
  </svg>

  <!-- 自绘标题栏：左标题+当前曲目｜右窗控；网页端由 CSS 隐藏 -->
  <div id="titlebar">
    <div class="tb-title"><span class="tb-dot"></span>LyricsWall</div>
    <div class="tb-track">
      <span id="trackName">未加载音乐</span>
      <span id="artistName" class="tb-artist"></span>
    </div>
    <div class="tb-controls">
      <button id="tbMin" class="tb-btn" title="最小化"><svg class="ico"><use href="#i-minus"/></svg></button>
      <button id="tbMax" class="tb-btn" title="最大化/还原"><svg class="ico"><use href="#i-expand"/></svg></button>
      <button id="tbClose" class="tb-btn close" title="关闭"><svg class="ico"><use href="#i-close"/></svg></button>
    </div>
  </div>

  <!-- 主区：左侧导航 + 工作区（预览 / 面板） -->
  <div id="mainArea">
    <nav id="sideNav">
      <button class="sn-btn" data-nav="play" title="本地播放"><svg class="ico"><use href="#i-play"/></svg><span>播放</span></button>
      <button class="sn-btn" data-nav="follow" title="跟随播放器"><svg class="ico"><use href="#i-link"/></svg><span>跟随</span></button>
      <button class="sn-btn" data-nav="lyrics" title="歌词搜索 / 粘贴 / 预览"><svg class="ico"><use href="#i-search"/></svg><span>歌词</span></button>
      <button class="sn-btn" data-nav="display" title="显示与特效设置"><svg class="ico"><use href="#i-settings"/></svg><span>显示</span></button>
      <button class="sn-btn" data-nav="output" title="输出：网页 / OBS / 全屏"><svg class="ico"><use href="#i-globe"/></svg><span>输出</span></button>
      <div class="sn-foot">
        <button id="btnPrevMode" class="sn-btn" title="切换预览大小"><svg class="ico"><use href="#i-expand"/></svg><span>预览</span></button>
      </div>
    </nav>

    <div id="workArea">
      <!-- 预览视口（输出画面全部内嵌于此；内部结构为输出端共享，不可改动） -->
      <div id="previewPane">
      <!-- 自定义/预设背景层（bg_mode 驱动；封面光晕模式时隐藏） -->
      <div id="bgCustom"></div>
      <!-- 封面环境光晕（用当前封面做大模糊背景，让玻璃真正透色） -->
      <div id="bgGlow"></div>
      <div id="bgVeil"></div>

      <!-- 碎片漂浮主视觉 -->
      <div id="stage"></div>

      <!-- 网页正式显示：卡片模式（iOS 黑白播放器卡 + AMLL 风居中大歌词） -->
      <div id="displayView">
        <div id="lyricCenter"><div id="lyricScroll"></div><div id="showStage"></div></div>
        <div id="pvStage"><canvas id="pvCanvas"></canvas></div>
        <div id="boxStage"><canvas id="boxCanvas"></canvas></div>
        <div id="npCard">
          <div class="np-info">
            <div class="np-cover-wrap"><img id="npCover" alt=""></div>
            <div class="np-text">
              <div class="np-title"><div class="np-title-scroller" id="npTitleScroller"><span id="npTitle">Nothing Playing</span></div></div>
              <div class="np-artist" id="npArtist"></div>
            </div>
            <div class="np-wave" id="npWave"><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="np-progress">
            <span id="npCur" class="np-time">0:00</span>
            <div class="np-bar-bg"><div id="npFill" class="np-bar-fill"></div></div>
            <span id="npRem" class="np-time">-0:00</span>
          </div>
        </div>
      </div>
      </div><!-- /#previewPane -->

      <!-- 显示模式切换（卡片/漂浮墙），网页与桌面预览均可用 -->
      <div id="viewToggle">
        <button class="vt-btn active" data-view="card">卡片</button>
        <button class="vt-btn" data-view="wall">漂浮墙</button>
        <button class="vt-btn" data-view="box">3D方块</button>
      </div>

      <!-- 功能面板区：同一时间只显示一页 -->
      <div id="panelArea" class="hidden">

        <!-- 播放面板 -->
        <section class="panel-page" data-page="play">
          <div class="pp-head"><svg class="ico"><use href="#i-play"/></svg>本地播放</div>
          <div class="pp-body">
            <div class="pp-card">
              <div class="pp-card-title">打开文件</div>
              <div class="pp-row">
                <button id="btnOpenAudio" class="cbtn" title="打开音频（本地）"><svg class="ico"><use href="#i-music"/></svg><span class="lbl">打开音频</span></button>
                <button id="btnOpenLrc" class="cbtn" title="打开 LRC（本地）"><svg class="ico"><use href="#i-file"/></svg><span class="lbl">打开歌词</span></button>
              </div>
            </div>
            <div class="pp-card">
              <div class="pp-card-title">音量</div>
              <div class="pp-row">
                <svg class="ico"><use href="#i-music"/></svg>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.9" title="音量（本地）">
              </div>
            </div>
            <div class="pp-hint">本地播放用于测试效果；正式使用请在「跟随」页接管系统播放器。</div>
          </div>
        </section>

        <!-- 跟随面板 -->
        <section class="panel-page" data-page="follow">
          <div class="pp-head"><svg class="ico"><use href="#i-link"/></svg>跟随播放器</div>
          <div class="pp-body">
            <div class="pp-card">
              <div class="pp-card-title">跟随开关</div>
              <div class="pp-row">
                <button id="btnFollow" class="cbtn wide" title="跟随系统播放器"><svg class="ico"><use href="#i-link"/></svg><span class="lbl">跟随播放器</span></button>
              </div>
            </div>
            <div class="pp-card">
              <div class="pp-card-title">选择播放器</div>
              <div id="followPlayerSlot"></div>
            </div>
            <div class="pp-card">
              <div class="pp-card-title">歌词匹配</div>
              <div class="pp-row">
                <button id="btnRefreshLyrics" class="cbtn" title="重新匹配歌词"><svg class="ico"><use href="#i-refresh"/></svg><span class="lbl">重新匹配歌词</span></button>
              </div>
            </div>
            <div class="pp-hint">酷狗用户想零漂移同步，需先打直连补丁，详见 README「酷狗零漂移补丁」。</div>
          </div>
        </section>

        <!-- 歌词面板：搜索 / 粘贴 / 预览 -->
        <section class="panel-page" data-page="lyrics">
          <div class="pp-head">
            <svg class="ico"><use href="#i-search"/></svg>歌词
            <div class="tabs pp-tabs">
              <button class="tab active" data-tab="search">搜索</button>
              <button class="tab" data-tab="paste">粘贴</button>
              <button class="tab" data-tab="preview">预览</button>
            </div>
          </div>
          <div class="pp-body pp-body-fill">
            <div class="tab-body" data-body="search">
              <div class="row">
                <input id="searchInput" placeholder="歌名 / 歌手">
                <button id="btnSearch">搜索</button>
              </div>
              <div id="searchResults" class="results"><div class="hint">输入关键词搜索在线歌词</div></div>
            </div>
            <div class="tab-body hidden" data-body="paste">
              <textarea id="pasteArea" placeholder="粘贴 LRC 歌词文本…"></textarea>
              <div class="row"><button id="btnApplyPaste">应用</button><button id="btnPreview">预览效果</button></div>
            </div>
            <div class="tab-body hidden" data-body="preview">
              <div id="previewList"></div>
            </div>
          </div>
        </section>

        <!-- 显示面板：原控制台（CONFIG_SCHEMA 动态生成） -->
        <section class="panel-page" data-page="display">
          <div class="pp-head">
            <svg class="ico"><use href="#i-settings"/></svg><span id="csTitle">显示模式</span>
          </div>
          <div class="pp-body pp-body-fill display-split">
            <nav id="csNav" class="cs-nav"></nav>
            <div id="consoleBody" class="console-body"></div>
          </div>
        </section>

        <!-- 输出面板 -->
        <section class="panel-page" data-page="output">
          <div class="pp-head"><svg class="ico"><use href="#i-globe"/></svg>输出</div>
          <div class="pp-body">
            <div class="pp-card">
              <div class="pp-card-title">输出地址（手机 / OBS 浏览器源打开）</div>
              <div id="serverUrl" class="pp-url"></div>
              <div class="pp-row">
                <button id="btnOpenWeb" class="cbtn" title="在浏览器打开（手机/多端）"><svg class="ico"><use href="#i-globe"/></svg><span class="lbl">浏览器打开</span></button>
              </div>
            </div>
            <div class="pp-card">
              <div class="pp-card-title">窗口</div>
              <div class="pp-row">
                <button id="btnFullscreen" class="cbtn" title="全屏 (F11)"><svg class="ico"><use href="#i-expand"/></svg><span class="lbl">全屏输出</span></button>
              </div>
            </div>
            <div class="pp-hint">OBS 接入：添加「浏览器」源，URL 填上方地址，宽高填你的画布分辨率。</div>
          </div>
        </section>

      </div><!-- /#panelArea -->
    </div><!-- /#workArea -->
  </div><!-- /#mainArea -->

  <!-- 底部状态条：播放控制 + 进度 + 偏移 + 徽标（常驻；网页端隐藏） -->
  <div id="statusBar">
    <div class="sb-cover-wrap">
      <img id="cover" class="hidden" alt="">
      <div class="sb-cover-empty" id="coverEmpty"><svg class="ico"><use href="#i-music"/></svg></div>
    </div>
    <button id="btnPlay" class="cbtn primary" title="播放/暂停（本地）">
      <svg class="ico ico-play"><use href="#i-play"/></svg>
      <svg class="ico ico-pause"><use href="#i-pause"/></svg>
    </button>
    <div class="sb-progress">
      <span id="curTime" class="sb-time">00:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="durTime" class="sb-time">00:00</span>
    </div>
    <div class="sb-offset">
      <button id="btnOffsetDown" class="cbtn sm" title="歌词提前"><svg class="ico"><use href="#i-minus"/></svg></button>
      <span id="offsetVal">0.0s</span>
      <button id="btnOffsetUp" class="cbtn sm" title="歌词延后"><svg class="ico"><use href="#i-plus"/></svg></button>
      <button id="btnRealign" class="cbtn sm" title="重新对齐"><svg class="ico"><use href="#i-realign"/></svg></button>
    </div>
    <div class="sb-badges">
      <span id="statusBadge" class="badge">已停止</span>
      <span id="syncStatus" class="badge hidden"></span>
      <span id="lrcBadge" class="badge">无歌词</span>
    </div>
  </div>

  <div id="syncHint" class="hint-bar"></div>

  <audio id="audio"></audio>

  <script src="lrc.js"></script>
  <script src="animator.js"></script>
  <script src="vendor/pixi.min.js"></script>
  <script src="pv-engine.js"></script>
  <script src="pv-templates.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="box-engine.js"></script>
  <script src="bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
